<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horrible Rotten Dancing Dragon Strikes (Text)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121821;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4aa3ff;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .game {
      width: min(900px, 92vw);
      background: var(--panel);
      border: 1px solid #1f2a36;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: var(--accent);
      letter-spacing: 0.3px;
    }
    #output {
      background: #0b1118;
      border: 1px solid #1b2633;
      border-radius: 8px;
      padding: 12px;
      min-height: 360px;
      max-height: 60vh;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.35;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    #command {
      flex: 1;
      background: #0b1118;
      color: var(--text);
      border: 1px solid #1b2633;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
    }
    #submit {
      background: var(--accent);
      color: #08121c;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #submit:disabled, #command:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Horrible Rotten Dancing Dragon Strikes — Text Edition</h1>
    <div id="output" aria-live="polite"></div>
    <form id="form" class="input-row" autocomplete="off">
      <input id="command" type="text" placeholder="What now?" />
      <button id="submit" type="submit">Enter</button>
    </form>
    <div class="hint">Commands: N, S, E, W, GO NORTH, LOOK, GET, DROP, INVENTORY, PUSH, HIT, DANCE, EAT, FEED, QUIT</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
